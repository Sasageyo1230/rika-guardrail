# LiveKit Server Configuration
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: false

redis:
  address: ""  # Not using Redis for now, using in-memory

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100

webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls: []  # Add webhook URLs here if needed

turn:
  enabled: false  # Enable if needed for NAT traversal
  # domain: turn.example.com
  # port: 3478
  # tls_port: 5349

logging:
  level: info
  sample: false

# Development settings
development: true